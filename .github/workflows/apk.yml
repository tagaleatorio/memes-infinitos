name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Ferramentas do Android
        run: |
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1 || true)
          if [ -z "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar o APK
        run: gradle assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk "Memes-Infinitos.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Memes-Infinitos-APK
          path: Memes-Infinitos.apk
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Memes Infinitos 1.${{ github.run_number }}
          body: Baixe o arquivo Memes-Infinitos.apk abaixo e abra no celular para instalar.
          files: Memes-Infinitos.apk
          make_latest: true
